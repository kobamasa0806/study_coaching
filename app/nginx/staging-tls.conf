# staging EC2 (TLS 化済み) 用 nginx 設定
# Let's Encrypt で取得した証明書を使い、HTTP → HTTPS リダイレクトを行う
#
# 想定マウント:
#   - /etc/letsencrypt:/etc/letsencrypt:ro   (host の Let's Encrypt ディレクトリ)
#   - /var/www/certbot (任意): certbot webroot 更新時に使用

upstream django {
    server backend:8000;
}

# HTTP: ACME challenge を受け、それ以外は HTTPS にリダイレクト
server {
    listen 80;
    server_name staging-api.ken-san.dev;

    # Let's Encrypt 更新時の HTTP-01 challenge 用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # それ以外は HTTPS へ強制
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 本体サーバ
server {
    listen 443 ssl;
    http2 on;
    server_name staging-api.ken-san.dev;

    # Let's Encrypt 証明書
    ssl_certificate /etc/letsencrypt/live/staging-api.ken-san.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.ken-san.dev/privkey.pem;

    # 推奨 SSL 設定 (Mozilla intermediate 相当)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (1年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # 静的ファイル
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # メディアファイル
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # ヘルスチェック (Django まで届くことを確認)
    location = /healthz/ {
        proxy_pass http://django;
        access_log off;
    }

    # その他は Django へリバプロ
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
