# staging EC2 で TLS 対応する際の overlay 設定
# docker-compose.staging.yml に重ねて使う:
#
#   docker compose \
#     -f docker-compose.staging.yml \
#     -f docker-compose.staging.tls.yml \
#     --env-file .env.staging \
#     up -d
#
# nginx を HTTPS 版設定に切り替え、Let's Encrypt 証明書をマウントする。

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
